<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NDSPKG Repository</title>
    <style>
        /* Dark GitHub/Homebrew-inspired styling matching repo.html */
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0d1117;
            color: #c9d1d9;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #58a6ff;
            border-bottom: 1px solid #30363d;
            padding-bottom: 10px;
        }
        .ascii-art {
            white-space: pre;
            color: #238636;
            font-weight: bold;
            margin-bottom: 20px;
            line-height: 1.2;
        }
        .package-list {
            list-style: none;
            padding: 0;
        }
        .package-item {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .package-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .package-name {
            font-size: 1.2em;
            color: #f0f6fc;
            font-weight: bold;
        }
        .package-version {
            font-size: 0.85em;
            color: #8b949e;
        }
        .download-btn {
            background-color: #238636;
            color: white;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.9em;
            font-family: sans-serif;
        }
        .download-btn:hover {
            background-color: #2ea44f;
        }
        .error {
            color: #f85149;
            font-weight: bold;
        }
        .loading {
            color: #8b949e;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="ascii-art">
 N D S    P K G
        </div>

        <h1>ndspkg Repository</h1>
        <p>Welcome to the ndspkg package index. This page is dynamically updated using index.json.</p>

        <h2>Available Packages</h2>
        <div id="loading" class="loading">Loading packages from index.json...</div>
        <ul id="packages" class="package-list"></ul>
    </div>

    <script>
        async function loadRepo() {
            const listElement = document.getElementById('packages');
            const loadingElement = document.getElementById('loading');

            try {
                // Fetch the index.json situated in the same directory
                const response = await fetch('./index.json');
                if (!response.ok) throw new Error('Could not load index.json');
                
                const data = await response.json();
                loadingElement.style.display = 'none';

                // Automatically handle arrays or structured root objects (e.g., data.packages)
                const packages = Array.isArray(data) ? data : (data.packages || Object.values(data));

                if (!packages || packages.length === 0) {
                    listElement.innerHTML = '<li>No packages found in index.json.</li>';
                    return;
                }

                packages.forEach(pkg => {
                    const li = document.createElement('li');
                    li.className = 'package-item';

                    // Extract fallback fields depending on how your JSON schema is built
                    const name = pkg.name || 'Unknown Package';
                    const version = pkg.version ? `v${pkg.version}` : '';
                    
                    // Prioritize full url values, fall back to relative path
                    const downloadUrl = pkg.url || pkg.download_url || `./packages/${pkg.filename || pkg.name}`;

                    li.innerHTML = `
                        <div class="package-info">
                            <span class="package-name">${name}</span>
                            ${version ? `<span class="package-version">${version}</span>` : ''}
                        </div>
                        <a href="${downloadUrl}" class="download-btn" download>Download</a>
                    `;
                    listElement.appendChild(li);
                });

            } catch (error) {
                loadingElement.className = 'error';
                loadingElement.innerText = `Error loading repository: ${error.message}`;
            }
        }

        // Initialize fetching on page load
        loadRepo();
    </script>
</body>
</html>
